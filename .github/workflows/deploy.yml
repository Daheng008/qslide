name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - run: npm ci
        # 仓库名即 GitHub Pages 子路径：https://<user>.github.io/<repo>/
        # 若仓库名不是 qslide，把下面 /qslide/ 改成 /<你的仓库名>/
      - run: PAGES_BASE=/qslide/ npm run build
      # 生成部署版 manifest（165 处 localhost→线上域名）并随站点一起发布，供用户下载安装
      - run: python3 scripts/gen_manifest_prod.py https://Daheng008.github.io/qslide
      - run: cp manifest.prod.xml dist/
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
